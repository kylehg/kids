[project]
name = "kids"
version = "0.1.0"
description = "KIDs (KyleIDs): short, sortable IDs made of a timestamp part and a random part."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
kid = "kids.cli:main"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.0"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
